name: RoyalPark Android
on:
  push:
    branches: [main, develop, overnight, 'feature/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: RoyalPark-v0.5-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
