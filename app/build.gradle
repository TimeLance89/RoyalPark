plugins {
    id 'com.android.application'
}

android {
    namespace 'app.royalpark.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'app.royalpark.mobile'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    testImplementation 'junit:junit:4.13.2'
}
